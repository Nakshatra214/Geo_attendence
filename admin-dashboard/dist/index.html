  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100vw';
        div.style.height = '100vh';
        div.style.backgroundColor = 'rgba(15, 23, 42, 0.95)';
        div.style.color = '#f87171';
        div.style.padding = '32px';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '14px';
        div.style.zIndex = '999999';
        div.style.overflow = 'auto';
        div.style.lineHeight = '1.5';
        div.innerHTML = '<h2 style="color: #ef4444; margin-bottom: 16px;">🔴 JavaScript Error Detected</h2>' +
          '<p><strong>Message:</strong> ' + message + '</p>' +
          '<p><strong>Source:</strong> ' + source + ':' + lineno + ':' + colno + '</p>' +
          '<pre style="background: #1e293b; padding: 16px; border-radius: 8px; margin-top: 16px; color: #cbd5e1; overflow-x: auto;">' + (error ? error.stack : '') + '</pre>';
        document.body.appendChild(div);
        return false;
      };
    </script>
